# ---------------------------------------------------------------------------
# nginx reverse proxy for the Astro frontend
# ---------------------------------------------------------------------------
# Sits in front of the Node server. Three jobs:
#   1. TLS termination
#   2. Serving /_astro/* straight from disk (immutable, hashed filenames)
#   3. Caching the SSR HTML at the edge so result-day traffic never reaches Node
#
# Install to /etc/nginx/sites-available/sarkarihub and symlink into
# sites-enabled. Replace every example-govjobs.com before use.
# ---------------------------------------------------------------------------

# Rate-limit zone for the API endpoints. 10 requests/second per IP is far above
# legitimate use and low enough to blunt a scrape or a webhook flood.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

# Cache zone for rendered HTML. 100MB holds a lot of ~100KB pages.
proxy_cache_path /var/cache/nginx/sarkarihub levels=1:2 keys_zone=sarkarihub:100m
                 max_size=2g inactive=7d use_temp_path=off;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example-govjobs.com www.example-govjobs.com;
    return 301 https://example-govjobs.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example-govjobs.com;
    # Canonical host: everything lives on the apex domain.
    ssl_certificate     /etc/letsencrypt/live/example-govjobs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-govjobs.com/privkey.pem;
    return 301 https://example-govjobs.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example-govjobs.com;

    ssl_certificate     /etc/letsencrypt/live/example-govjobs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-govjobs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is set by the app for HTTPS requests; declaring it here too is
    # harmless and covers responses that never reach Node.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not advertise the nginx version.
    server_tokens off;

    # Compression. Brotli first if the module is available, gzip as the floor.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;

    client_max_body_size 2m;

    # -----------------------------------------------------------------------
    # Static assets — hashed filenames, so cache them forever.
    #
    # These paths assume the PM2 / bare-metal layout, where the app lives at
    # /srv/sarkarihub/app and the build output at /srv/sarkarihub/app/dist.
    # They match deploy/ecosystem.config.cjs: cwd=/srv/sarkarihub/app with
    # script=./dist/server/entry.mjs.
    #
    # IF YOU RUN THE APP IN DOCKER, nginx on the host cannot reach a path inside
    # the container — `alias` would 404 and every asset would fall through to
    # the proxy. Either bind-mount the build output onto the host and point
    # these two paths at the mount, or delete both location blocks and let
    # nginx proxy everything to the app (correct, slightly slower, and the
    # container already sets long cache headers on /_astro/ itself).
    #
    # `npm run deploy:check` verifies these paths against the real build output.
    # -----------------------------------------------------------------------
    location /_astro/ {
        alias /srv/sarkarihub/app/dist/client/_astro/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(svg|woff2|png|jpg|jpeg|webp|avif|ico)$ {
        root /srv/sarkarihub/app/dist/client;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri @app;
    }

    # -----------------------------------------------------------------------
    # API endpoints — never cached, tighter rate limit.
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # Everything else — SSR HTML, cached at the edge.
    #
    # The cache key deliberately ignores cookies and query strings that do not
    # affect output. Theme and language live in the URL or in localStorage, so
    # there is nothing per-user to vary on — which is what keeps the hit rate
    # near 100% and WordPress load near zero.
    #
    # `stale-while-revalidate` is the important directive: after the 5-minute
    # fresh window expires, visitors still get the cached page instantly while
    # nginx refreshes it in the background. Nobody ever waits for Node.
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_cache sarkarihub;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # A stale page beats an error page. If Node is down, keep serving the
        # last good render for up to an hour.
        proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_read_timeout 30s;

        # Report cache status in the header for debugging:
        #   curl -I https://example-govjobs.com/ | grep X-Cache-Status
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location @app {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
    }

    # Do not let the ACME challenge be proxied.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    access_log /var/log/nginx/sarkarihub.access.log;
    error_log  /var/log/nginx/sarkarihub.error.log warn;
}
